# SCAFFOLD, not a design deliverable. `status: scaffold` keeps it out of every eligible set
# that is not a fixture build (ARCHITECTURE §10); `grade: ungraded` and the absence of a
# `signature_move` keep it out of the library proper. Authoring the real hero family —
# arrangements, reviewers, the rubric at both content extremes — is P7, and human.
name: hero/service_statement
type: registry:section
title: Service statement hero
description: Scaffold. Renders the hero beat of the service_clarity fallback archetype.
schema_version: 1
family: hero
status: scaffold
novelty_class: service_statement
fallback: true

files:
  - { path: service_statement.astro, type: registry:section }

dependencies: ['@ada/library']
registryDependencies: []

serves_beats: [hook]
serves_rhythm_roles: [impact]
requires: []

slots:
  - slot: headline
    required: true
    source: { kind: generated, grounded_in: [business.founded_year], may_claim: quotable_only }
    max_chars: 64
    register: inherit_positioning
  - slot: standfirst
    required: true
    source: { kind: generated, grounded_in: [], may_claim: false }
    max_chars: 180
  - slot: media
    required: true
    source: { kind: asset, query: 'media.photos[0]' }

affinity:
  industries: []

design_compat:
  systems: [reference_v1]

composition:
  density: sparse
  background_weight: image
  focal_weight: 3
  approx_vh: 86
  media_dependency: photo_required
  text_volume: { headline_max_chars: 64, body_max_chars: 180 }

# tier_0 throughout: the scaffolds ship no JavaScript at all, so there is nothing to run under
# reduced motion and nothing to count against the page budget.
motion:
  effect: poster_loop
  pattern: none
  tier: tier_0
  trigger: load
  density: 0
  budget_ms: 0
  main_thread_ms_est: 0
  reduced_motion_fallback: poster

budget: { js_kb: 0, blocks_lcp: true, requires_webgl: false }

a11y:
  interactive: false
  reduced_motion_fallback: 'Nothing animates; the section is static markup.'
  contrast_pairs:
    - [fg.primary, bg.base]

priors:
  status: unproven
  note: Scaffold. No belief either way.

arrangements:
  - id: stacked-left
    novelty_class: stacked_statement
    props: { align: left }
    grade: ungraded
    asset_constraints:
      - { slot: media, min_aspect: 1.2, max_aspect: 1.8, min_width: 1600 }
