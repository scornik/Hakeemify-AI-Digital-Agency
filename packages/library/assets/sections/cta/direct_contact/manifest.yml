# SCAFFOLD, not a design deliverable. `status: scaffold` keeps it out of every eligible set
# that is not a fixture build (ARCHITECTURE §10); `grade: ungraded` and the absence of a
# `signature_move` keep it out of the library proper. Authoring the real cta family —
# arrangements, reviewers, the rubric at both content extremes — is P7, and human.
name: cta/direct_contact
type: registry:section
title: Direct contact CTA
description: Scaffold. Renders the cta beat of the service_clarity fallback archetype.
schema_version: 1
family: cta
status: scaffold
novelty_class: direct_contact
fallback: true

files:
  - { path: direct_contact.astro, type: registry:section }

dependencies: ['@ada/library']
registryDependencies: []

serves_beats: [offer]
serves_rhythm_roles: [offer]
requires: []

slots:
  - slot: heading
    required: true
    source: { kind: generated, grounded_in: [], may_claim: false }
    max_chars: 48
  - slot: promise
    required: true
    source: { kind: fact, query: business.response_time_promise }
  - slot: phone
    required: true
    source: { kind: fact, query: contact.phone }
  - slot: email
    required: true
    source: { kind: fact, query: contact.email }

affinity:
  industries: []

design_compat:
  systems: [reference_v1]

composition:
  density: medium
  background_weight: accent
  focal_weight: 2
  approx_vh: 48
  media_dependency: none
  text_volume: { headline_max_chars: 48, body_max_chars: 160 }

# tier_0 throughout: the scaffolds ship no JavaScript at all, so there is nothing to run under
# reduced motion and nothing to count against the page budget.
motion:
  effect: poster_loop
  pattern: none
  tier: tier_0
  trigger: load
  density: 0
  budget_ms: 0
  main_thread_ms_est: 0
  reduced_motion_fallback: poster

budget: { js_kb: 0, blocks_lcp: false, requires_webgl: false }

a11y:
  interactive: false
  reduced_motion_fallback: 'Nothing animates; the section is static markup.'
  contrast_pairs:
    - [fg.primary, bg.base]

priors:
  status: unproven
  note: Scaffold. No belief either way.

arrangements:
  - id: split-detail
    novelty_class: split_contact_detail
    props: { layout: split }
    grade: ungraded
