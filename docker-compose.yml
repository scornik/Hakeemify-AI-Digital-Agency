services:
  postgres:
    image: postgres:17-alpine
    container_name: ada_postgres
    environment:
      POSTGRES_USER: ada
      POSTGRES_PASSWORD: ada
      POSTGRES_DB: ada
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ada -d ada']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ada_pgdata:/var/lib/postgresql/data

  # The engine. A batch job, not a service: `docker compose run --rm engine` rather than `up`.
  # `up` would start it, run one build, and exit — which looks like a crashing service.
  engine:
    build: .
    # Chromium's renderers need more than Docker's default 64 MB of /dev/shm; below ~512 MB it
    # crashes mid-page and Playwright reports a timeout, which points at the wrong thing.
    shm_size: '1gb'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `postgres`, not localhost: inside the compose network the host is the service name.
      DATABASE_URL: postgres://ada:ada@postgres:5432/ada
      # Raise per invocation. The image default is a tripwire against a real provider being wired
      # in by accident, not a budget.
      ADA_MAX_COST_USD: '${ADA_MAX_COST_USD:-0.01}'
    volumes:
      # The three documents a run produces, so they outlive the container.
      - ./artifacts:/app/artifacts
      # The tier-2 proposal queue. Nothing reads it back into a rule pack; promotion to tier 1 is
      # a human editing tier1.ts.
      - ./_proposed:/app/_proposed

volumes:
  ada_pgdata:
