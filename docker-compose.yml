services:
  postgres:
    image: postgres:17-alpine
    container_name: ada_postgres
    environment:
      POSTGRES_USER: ada
      POSTGRES_PASSWORD: ada
      POSTGRES_DB: ada
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ada -d ada']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ada_pgdata:/var/lib/postgresql/data

volumes:
  ada_pgdata:
